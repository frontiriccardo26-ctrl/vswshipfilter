plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'net.claudemod.vsw_shipfilter'
archivesBaseName = 'vsw_shipfilter'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                vsw_shipfilter { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                vsw_shipfilter { source sourceSets.main }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'mixins.vsw_shipfilter.refmap.json'
    config 'mixins.vsw_shipfilter.json'
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'Valkyrien Skies'
        url = 'https://maven.valkyrienskies.org'
    }
    maven {
        name = 'Sponge / Mixin'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'

    // Valkyrien Skies 2 dependency (compileOnly - provided at runtime by the user)
    compileOnly fg.deobf('org.valkyrienskies:valkyrienskies-120-forge:2.3.0+beta.3')

    // The original mod as a dependency (compileOnly)
    compileOnly files('libs/valkyrien_space_war-0_6_18.jar')
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'vsw_shipfilter',
            'Specification-Vendor'    : 'claudemod',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'claudemod',
            'MixinConfigs'            : 'mixins.vsw_shipfilter.json'
        ])
    }
}
